[extend]
useDefault = true

[allowlist]
paths = ['''pnpm-lock\.yaml''']

# Yandex OAuth tokens: Yandex ID's examples start them with y0_ followed by base64url text
# (https://yandex.ru/dev/id/doc/en/tokens/debug-token); the prefix is the observed format, not a promised one.
[[rules]]
id = "yandex-oauth-token"
description = "Yandex OAuth token"
regex = '''\b(y[0-9]_[A-Za-z0-9_-]{30,})'''
secretGroup = 1
keywords = ["y0_", "y1_", "y2_", "y3_"]

# The older Yandex token format, 39 characters from AQAAAA; Yandex may no longer issue it.
[[rules]]
id = "yandex-oauth-token-legacy"
description = "Yandex OAuth token, older format"
regex = '''\b(AQAAAA[A-Za-z0-9_-]{33})\b'''
secretGroup = 1
keywords = ["AQAAAA"]
